<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FortIRL</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* One screen: the insignia and the name in the middle, gameplay drifting around them. */
:root {
  --obsidian: #101211;
  --line: #414541;
  --bone: #E9E7DE;
  --amber: #D4A34F;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--obsidian);
  color: var(--bone);
  overflow: hidden;
  padding-left: max(0px, env(safe-area-inset-left, 0px));
  padding-right: max(0px, env(safe-area-inset-right, 0px));
}
.stage { position: relative; width: 100%; height: 100%; min-height: 100%; overflow: hidden; }

/* a faint tactical grid, fading out to the edges */
.stage::before {
  content: ""; position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(233,231,222,.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(233,231,222,.045) 1px, transparent 1px);
  background-size: 64px 64px;
  -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
          mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
}

/* ---- the gameplay shots ---- */
.shot {
  position: absolute;
  width: var(--w);
  left: var(--x); top: var(--y);
  opacity: .72;
  animation: drift var(--d) ease-in-out var(--delay) infinite alternate, appear 1.2s ease-out var(--in) both;
}
.shot .frame { position: relative; padding: 9px; transform: rotate(var(--r)); }
.shot img { display: block; width: 100%; height: auto; border-radius: 4px; border: 1px solid var(--line); box-shadow: 0 24px 60px rgba(0,0,0,.55); }
.shot i { position: absolute; width: 18px; height: 18px; border: 2px solid var(--amber); }
.shot i:nth-of-type(1) { top: 0; left: 0; border-right: none; border-bottom: none; }
.shot i:nth-of-type(2) { top: 0; right: 0; border-left: none; border-bottom: none; }
.shot i:nth-of-type(3) { bottom: 0; left: 0; border-right: none; border-top: none; }
.shot i:nth-of-type(4) { bottom: 0; right: 0; border-left: none; border-top: none; }

.s1 { --w: 30vw; --x: -3vw;  --y: 6vh;   --r: -5deg; --d: 9s;  --delay: 0s;    --in: .5s; }
.s2 { --w: 26vw; --x: 72vw;  --y: 4vh;   --r: 4deg;  --d: 11s; --delay: -3s;   --in: .65s; }
.s3 { --w: 24vw; --x: 2vw;   --y: 62vh;  --r: 3deg;  --d: 10s; --delay: -5s;   --in: .8s; }
.s4 { --w: 28vw; --x: 70vw;  --y: 60vh;  --r: -4deg; --d: 12s; --delay: -2s;   --in: .95s; }
.s5 { --w: 19vw; --x: 38vw;  --y: -3vh;  --r: 2deg;  --d: 13s; --delay: -7s;   --in: 1.1s; }
.s6 { --w: 20vw; --x: 41vw;  --y: 76vh;  --r: -2deg; --d: 10s; --delay: -4s;   --in: 1.25s; }

/* ---- the middle ---- */
.center {
  position: absolute; inset: 0; z-index: 5;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4vh;
  pointer-events: none;
}
/* a dark pool behind the logo so it always reads over the shots */
.center::before {
  content: ""; position: absolute; width: min(80vw, 900px); height: min(70vh, 640px);
  background: radial-gradient(closest-side, rgba(16,18,17,.96), rgba(16,18,17,.85) 55%, rgba(16,18,17,0));
}
.mark { position: relative; width: clamp(110px, 17vmin, 200px); height: auto; filter: drop-shadow(0 0 28px rgba(212,163,79,.35)); animation: breathe 5s ease-in-out 1.6s infinite; }
.mark .seg { transform-box: view-box; transform-origin: 60px 60px; animation: assemble 1s cubic-bezier(.2,.9,.25,1) both; }
.mark .seg:nth-child(1) { --dx: 0px;  --dy: -40px; animation-delay: .1s; }
.mark .seg:nth-child(2) { --dx: 40px; --dy: 0px;   animation-delay: .25s; }
.mark .seg:nth-child(3) { --dx: 0px;  --dy: 40px;  animation-delay: .4s; }
.mark .seg:nth-child(4) { --dx: -40px; --dy: 0px;  animation-delay: .55s; }
.word { position: relative; width: clamp(240px, 46vmin, 560px); height: auto; animation: rise 1s cubic-bezier(.2,.8,.2,1) .8s both; }

@keyframes drift {
  from { transform: translate3d(0, 0, 0); }
  to   { transform: translate3d(1.2vw, -2.4vh, 0); }
}
@keyframes appear { from { opacity: 0; } to { opacity: .72; } }
@keyframes assemble { from { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(-45deg); } to { opacity: 1; transform: none; } }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes breathe { 0%, 100% { filter: drop-shadow(0 0 22px rgba(212,163,79,.28)); } 50% { filter: drop-shadow(0 0 40px rgba(212,163,79,.55)); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; }
}

/* phones and tall windows: bigger shots, fewer of them */
@media (max-aspect-ratio: 1/1) {
  .s1 { --w: 62vw; --x: -10vw; --y: 3vh; }
  .s2 { --w: 56vw; --x: 52vw;  --y: 14vh; }
  .s3 { --w: 58vw; --x: -6vw;  --y: 70vh; }
  .s4 { --w: 60vw; --x: 46vw;  --y: 80vh; }
  .s5, .s6 { display: none; }
}
</style>
</head>
<body>

<div class="stage">
  <figure class="shot s1" style="margin:0"><div class="frame"><i></i><i></i><i></i><i></i><img src="img/hud.webp" alt="Two block-built zombies closing in down a corridor, with the game's heads-up display" width="1440" height="666"></div></figure>
  <figure class="shot s2" style="margin:0"><div class="frame"><i></i><i></i><i></i><i></i><img src="img/bite.webp" alt="A zombie biting at point-blank range, the screen edge flashing red" width="1440" height="666"></div></figure>
  <figure class="shot s3" style="margin:0"><div class="frame"><i></i><i></i><i></i><i></i><img src="img/hold.webp" alt="Holding the zone at the helicopter, wave one of two" width="1440" height="666"></div></figure>
  <figure class="shot s4" style="margin:0"><div class="frame"><i></i><i></i><i></i><i></i><img src="img/extract.webp" alt="The final wave, with the Hold to extract button" width="1440" height="666"></div></figure>
  <figure class="shot s5" style="margin:0"><div class="frame"><i></i><i></i><i></i><i></i><img src="img/map.webp" alt="Map of the Schmeichel Building with the helicopter in the atrium" width="1440" height="666"></div></figure>
  <figure class="shot s6" style="margin:0"><div class="frame"><i></i><i></i><i></i><i></i><img src="img/endless.webp" alt="Endless mode, waves around the squad" width="1440" height="666"></div></figure>

  <div class="center">
    <svg class="mark" viewBox="0 0 120 120" role="img" aria-label="FortIRL insignia">
      <polygon class="seg" points="64,2 74,12 74,22 108,56 75,56 64,45" fill="#D4A34F"/>
      <polygon class="seg" points="118,64 108,74 98,74 64,108 64,75 75,64" fill="#D4A34F"/>

      <polygon class="seg" points="2,56 12,46 22,46 56,12 56,45 45,56" fill="#D4A34F"/>
    </svg>

    </svg>
  </div>
</div>
</body>
</html>
