; Gun controller: ESP32 Super Mini, two buttons -> WebSocket /device on the game server.
; The boards in hand are ESP32-S3 Super Minis. The C3 env is kept in case of C3 boards.
[platformio]
default_envs = esp32-s3

[common]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    links2004/WebSockets@^2.4.1
    tzapu/WiFiManager@^2.0.17

[env:esp32-s3]
extends = common
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.partitions = default.csv

[env:esp32-c3]
extends = common
board = esp32-c3-devkitm-1
